site_name: cornice-apispec
site_description: OpenAPI spec generation for Cornice/Pyramid with Marshmallow and OneOfSchema support
site_url: https://cartaorobbin.github.io/cornice-apispec/
repo_url: https://github.com/cartaorobbin/cornice-apispec
repo_name: cartaorobbin/cornice-apispec
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - View predicates: predicates.md
  - OneOfSchema collisions: oneof-collisions.md
  - API reference: reference.md
  - Development: development.md
