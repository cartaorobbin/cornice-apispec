[tool.poetry]
name = "cornice-apispec"
version = "0.1.1"
description = "OpenAPI spec generation for Cornice/Pyramid with Marshmallow and OneOfSchema support"
authors = ["Robbin"]
license = "BSD-3-Clause"
readme = "README.md"
packages = [{include = "cornice_apispec", from = "src"}]
homepage = "https://github.com/cartaorobbin/cornice-apispec"
repository = "https://github.com/cartaorobbin/cornice-apispec"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pyramid",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["pyramid", "openapi", "apispec", "marshmallow", "cornice", "swagger"]

[tool.poetry.dependencies]
python = "^3.11"
pyramid-apispec = ">=0.4"
cornice = ">=6.0.0"
marshmallow = ">=3.13.0,<4.0.0"
marshmallow-oneofschema = ">=3.0.1,<4.0.0"
apispec = ">=6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
ruff = ">=0.1.0"
mkdocs-material = "^9.8.1"
mkdocstrings = {extras = ["python"], version = "^1.0.8"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
extend-exclude = [".claude", ".cursor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"
